<!doctype html>
<html lang="he" dir="rtl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ניהול הלוח · עת לדעת</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fffaf0;color:#173c55;font-family:Arial,sans-serif}.admin-top{padding:14px 20px;border-bottom:1px solid #d8b56e;display:flex;align-items:center;justify-content:space-between;gap:15px}.admin-top strong{font-size:19px}.admin-top a{color:#173c55}.admin-help{margin:0;padding:12px 20px;line-height:1.6;font-size:14px}iframe{display:block;width:100%;height:calc(100dvh - 120px);min-height:600px;border:0}
</style>
<div class="admin-top"><strong>ניהול הלוח · עת לדעת</strong><a href="./">חזרה ללוח הקהילה</a></div>
<p class="admin-help">היכנסו בחשבון המנהל, הפעילו מצב עריכה ובחרו יום בלוח כדי להוסיף או לערוך הודעה.</p>
<iframe id="board" src="./index.html" title="לוח הקהילה וממשק הניהול"></iframe>
<script>
document.getElementById('board').addEventListener('load',function(){
 try{
  const doc=this.contentDocument;
  const style=doc.createElement('style');
  style.textContent='header{display:flex!important;flex-wrap:wrap;gap:12px;margin-bottom:20px;padding:16px;border:1px solid #d8b56e;border-radius:18px;background:#fff5e2;color:#173c55}header h1{font-size:23px}header p{font-size:14px}header button{background:#fffaf0;color:#173c55;border:1px solid #c5a15c}.head-actions{display:flex;gap:8px;flex-wrap:wrap}';
  doc.head.append(style);
 }catch{
  document.querySelector('.admin-help').textContent='לא ניתן לפתוח את ממשק הניהול. חזרו ללוח ונסו שוב.';
 }
});
</script>
</html>
